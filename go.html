<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue Offer - FinShare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            padding: 18px 14px 36px;
        }
        .lead-shell {
            max-width: 440px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 22px;
            padding: 20px 16px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
        }
        .offer-heading {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 14px;
        }
        .banner-card {
            background: linear-gradient(135deg, #fff7ed 0%, #eff6ff 100%);
            border: 1px solid #dbeafe;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .banner-title {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .banner-sub {
            font-size: 12.5px;
            color: #475569;
            line-height: 1.45;
        }
        .partner-strip {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 9px 12px;
            margin-bottom: 14px;
            font-size: 12px;
            color: #334155;
            display: none;
        }
        .partner-strip strong {
            color: #1d4ed8;
        }
        .field-group {
            margin-bottom: 12px;
        }
        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }
        .field-input {
            width: 100%;
            height: 44px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 0 12px;
            font-size: 14px;
            color: #0f172a;
            background: #ffffff;
            outline: none;
        }
        .field-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .terms-row {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 14px 0 18px;
            font-size: 12.5px;
            color: #475569;
            line-height: 1.45;
        }
        .terms-row input[type="checkbox"] {
            width: 17px;
            height: 17px;
            margin-top: 2px;
            accent-color: #2563eb;
            flex-shrink: 0;
            cursor: pointer;
        }
        .terms-row a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }
        .btn-proceed {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 14px;
            background: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
        }
        .btn-proceed:hover {
            background: #1d4ed8;
        }
        .btn-proceed:disabled {
            background: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }
        .error-msg {
            margin-top: 10px;
            font-size: 12.5px;
            font-weight: 600;
            color: #dc2626;
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="lead-shell">
        <h1 class="offer-heading" id="goOfferTitle">Offer</h1>

        <div class="banner-card">
            <div class="banner-title" id="goOfferSubtitle">Complete Your Application</div>
            <div class="banner-sub" id="goOfferDesc">Apni details bhar kar aage badhein taaki aapka referral sahi partner ke saath track ho sake.</div>
        </div>

        <div class="partner-strip" id="partnerRefBox"></div>

        <form id="customerLeadForm" novalidate>
            <div class="field-group">
                <label class="field-label" for="firstNameInput">First Name</label>
                <input class="field-input" type="text" id="firstNameInput" placeholder="First Name" required />
            </div>

            <div class="field-group">
                <label class="field-label" for="lastNameInput">Last Name</label>
                <input class="field-input" type="text" id="lastNameInput" placeholder="Last Name" required />
            </div>

            <div class="field-group">
                <label class="field-label" for="emailInput">Enter Email</label>
                <input class="field-input" type="email" id="emailInput" placeholder="Enter Email" required />
            </div>

            <div class="field-group">
                <label class="field-label" for="mobileInput">Enter Mobile Number</label>
                <input class="field-input" type="tel" id="mobileInput" inputmode="numeric" maxlength="15" placeholder="Enter Mobile Number" required />
            </div>

            <label class="terms-row">
                <input type="checkbox" id="agreeTermsCheck" checked required />
                <span>
                    Before submitting my information. I have read and agree to
                    <a href="index.html" target="_blank" rel="noopener noreferrer">Terms of Use &amp; Privacy Policy</a>
                </span>
            </label>

            <button type="submit" class="btn-proceed" id="proceedLeadBtn">PROCEED</button>
            <div class="error-msg" id="leadFormError"></div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAQe7Xl_TNHRRcn1993qQFnBFdvpbIb4wU",
          authDomain: "finshareapp-3421a.firebaseapp.com",
          projectId: "finshareapp-3421a",
          storageBucket: "finshareapp-3421a.firebasestorage.app",
          messagingSenderId: "805920794704",
          appId: "1:805920794704:web:d92873a30707568abf8955",
          measurementId: "G-WKKVMKPCK6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const refUid = (params.get("ref") || "").trim();
        const pid = (params.get("pid") || "").trim();
        const title = (params.get("title") || "Offer").trim();
        const rawUrl = (params.get("url") || "https://finshareapp.in").trim();

        let partnerMeta = {
            userId: refUid,
            partnerCode: (params.get("rcode") || (refUid ? "FS" + refUid.slice(-4).toUpperCase() : "")).trim(),
            partnerName: (params.get("pname") || "").trim(),
            partnerMobile: (params.get("pmobile") || "").trim(),
            partnerEmail: (params.get("pemail") || "").trim()
        };

        let safeTargetUrl = "https://finshareapp.in";
        let resolvedTitle = title;

        function setTargetUrl(raw) {
            try {
                const parsed = new URL(raw);
                if (parsed.protocol === "https:" || parsed.protocol === "http:") {
                    if (refUid && !parsed.searchParams.get("subid")) {
                        parsed.searchParams.set("subid", refUid);
                    }
                    safeTargetUrl = parsed.toString();
                }
            } catch (e) {}
        }
        setTargetUrl(rawUrl);

        document.title = `${resolvedTitle} - FinShare`;
        document.getElementById("goOfferTitle").textContent = resolvedTitle;

        const partnerBox = document.getElementById("partnerRefBox");
        function updatePartnerBox() {
            const labelName = partnerMeta.partnerName || "Partner";
            const labelId = partnerMeta.partnerCode ? ` (${partnerMeta.partnerCode})` : "";
            if (partnerMeta.partnerName || partnerMeta.partnerCode) {
                partnerBox.style.display = "block";
                partnerBox.textContent = "Referred by: ";
                const strongEl = document.createElement("strong");
                strongEl.textContent = `${labelName}${labelId}`;
                partnerBox.appendChild(strongEl);
            }
        }
        updatePartnerBox();

        async function hydrateMetaFromFirestore() {
            if (refUid && (!partnerMeta.partnerName || !partnerMeta.partnerMobile || !partnerMeta.partnerEmail)) {
                try {
                    const uSnap = await getDoc(doc(db, "users", refUid));
                    if (uSnap.exists()) {
                        const uData = uSnap.data();
                        if (!partnerMeta.partnerName && uData.name) partnerMeta.partnerName = uData.name;
                        if (!partnerMeta.partnerMobile && uData.phone) partnerMeta.partnerMobile = uData.phone;
                        if (!partnerMeta.partnerEmail && uData.email) partnerMeta.partnerEmail = uData.email;
                        updatePartnerBox();
                    }
                } catch (e) {}
            }

            if (pid) {
                try {
                    const pSnap = await getDoc(doc(db, "products", pid));
                    if (pSnap.exists()) {
                        const pData = pSnap.data();
                        if (pData.title) {
                            resolvedTitle = pData.title;
                            document.title = `${resolvedTitle} - FinShare`;
                            document.getElementById("goOfferTitle").textContent = resolvedTitle;
                        }
                        if (pData.shareUrl) {
                            setTargetUrl(pData.shareUrl);
                        }
                        if (pData.subtitle) {
                            document.getElementById("goOfferSubtitle").textContent = pData.subtitle;
                        }
                        if (pData.details || pData.description) {
                            document.getElementById("goOfferDesc").textContent = pData.details || pData.description;
                        }
                    }
                } catch (e) {}
            }
        }
        hydrateMetaFromFirestore();

        const form = document.getElementById("customerLeadForm");
        const errEl = document.getElementById("leadFormError");
        const submitBtn = document.getElementById("proceedLeadBtn");
        let isSubmitting = false;

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (isSubmitting) return;
            errEl.textContent = "";

            const firstName = document.getElementById("firstNameInput").value.trim();
            const lastName = document.getElementById("lastNameInput").value.trim();
            const email = document.getElementById("emailInput").value.trim();
            const mobile = document.getElementById("mobileInput").value.replace(/\D/g, "").trim();
            const agreed = document.getElementById("agreeTermsCheck").checked;

            if (!firstName || !lastName) {
                errEl.textContent = "Kripya First Name aur Last Name dono bharein.";
                return;
            }
            if (!email || !email.includes("@")) {
                errEl.textContent = "Kripya sahi Email address bharein.";
                return;
            }
            if (!mobile || mobile.length < 10) {
                errEl.textContent = "Kripya sahi 10-digit Mobile Number bharein.";
                return;
            }
            if (!agreed) {
                errEl.textContent = "Aage badhne ke liye Terms of Use & Privacy Policy par tick karein.";
                return;
            }

            isSubmitting = true;
            submitBtn.disabled = true;
            submitBtn.textContent = "PROCESSING...";

            const dedupKey = `${refUid}|${pid}|${mobile}`;
            const alreadySentKey = "FINSHARE_LEAD_SENT_" + dedupKey;
            let alreadySentRecently = false;
            try {
                const lastSent = Number(sessionStorage.getItem(alreadySentKey) || 0);
                if (lastSent && Date.now() - lastSent < 120000) {
                    alreadySentRecently = true;
                }
            } catch (e) {}

            if (!alreadySentRecently) {
                try {
                    const existingSnap = await getDocs(
                        query(
                            collection(db, "leads"),
                            where("productId", "==", pid || ""),
                            where("customerMobile", "==", mobile)
                        )
                    );

                    if (!existingSnap.empty) {
                        try {
                            sessionStorage.setItem(alreadySentKey, String(Date.now()));
                        } catch (e) {}
                        window.location.replace(safeTargetUrl);
                        return;
                    }
                } catch (dupErr) {
                    console.warn("Duplicate lead check skipped:", dupErr);
                }

                const leadPayload = {
                    userId: refUid || "",
                    partnerCode: partnerMeta.partnerCode || "",
                    partnerName: partnerMeta.partnerName || "",
                    partnerMobile: partnerMeta.partnerMobile || "",
                    partnerEmail: partnerMeta.partnerEmail || "",
                    productId: pid || "",
                    productTitle: resolvedTitle,
                    customerFirstName: firstName,
                    customerLastName: lastName,
                    customerName: `${firstName} ${lastName}`.trim(),
                    customerEmail: email,
                    customerMobile: mobile,
                    status: "Pending",
                    amount: 0,
                    targetUrl: safeTargetUrl,
                    createdAt: new Date().toISOString(),
                    serverTime: serverTimestamp()
                };

                try {
                    await addDoc(collection(db, "leads"), leadPayload);
                    try {
                        sessionStorage.setItem(alreadySentKey, String(Date.now()));
                    } catch (e) {}
                } catch (err) {
                    console.error("Lead save error:", err);
                    errEl.textContent = "Lead save karne mein issue aaya, phir bhi aage bheja ja raha hai...";
                }
            }

            window.location.replace(safeTargetUrl);
        });
    </script>
</body>
</html>
