<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinShare - Login / Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        .logo-badge {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 10px 14px;
            font-weight: bold;
            border-radius: 12px;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }
        .logo-text h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
        }
        .logo-text p {
            font-size: 13px;
            color: #64748b;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 700;
            color: #0f172a;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            color: #1e293b;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .forgot-pass {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
        }
        .forgot-pass span {
            font-size: 13px;
            color: #2563eb;
            font-weight: 600;
            cursor: pointer;
        }
        .status-msg {
            font-size: 13px;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            font-weight: 500;
        }
        .status-error {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        .status-success {
            background-color: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }
        .btn-main {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: opacity 0.2s;
        }
        .btn-main:hover {
            opacity: 0.9;
        }
        .btn-main:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .toggle-text {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-top: 15px;
        }
        .toggle-text span {
            color: #2563eb;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <div class="logo-badge">FS</div>
            <div class="logo-text">
                <h2>FinShare</h2>
                <p>Earn by offers</p>
            </div>
        </div>

        <h1 id="formTitle">Login to your account</h1>

        <div id="statusBox" class="status-msg"></div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="form-group" id="nameField" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
            </div>

            <div class="form-group" id="phoneField" style="display: none;">
                <label>Mobile Number</label>
                <input type="tel" id="phoneNumber" placeholder="Enter mobile number" maxlength="10">
            </div>

            <div class="form-group">
                <label id="identifierLabel">Email Address</label>
                <input type="text" id="email" placeholder="Enter email address or mobile number" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <div class="forgot-pass" id="forgotPassBox">
                <span onclick="handleForgotPassword()">Forgot Password?</span>
            </div>

            <button type="submit" class="btn-main" id="submitBtn">Login</button>
        </form>

        <div class="toggle-text" id="switchText">
            Don't have an account? <span onclick="toggleMode()">Create New Account</span>
        </div>
    </div>

    <!-- Firebase SDKs & Auth + Firestore Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            updateProfile,
            sendPasswordResetEmail,
            deleteUser,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAQe7Xl_TNHRRcn1993qQFnBFdvpbIb4wU",
          authDomain: "finshareapp-3421a.firebaseapp.com",
          projectId: "finshareapp-3421a",
          storageBucket: "finshareapp-3421a.firebasestorage.app",
          messagingSenderId: "805920794704",
          appId: "1:805920794704:web:d92873a30707568abf8955",
          measurementId: "G-WKKVMKPCK6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const DEVICE_LOCK_KEY = "FINSHARE_LOCKED_UID";
        let isSignup = false;

        function showMessage(msg, isError = true) {
            const box = document.getElementById('statusBox');
            box.innerText = msg;
            box.className = isError ? 'status-msg status-error' : 'status-msg status-success';
            box.style.display = 'block';
        }

        function hideMessage() {
            document.getElementById('statusBox').style.display = 'none';
        }

        function normalizePhone(rawPhone) {
            return String(rawPhone || "").replace(/\D/g, "").trim();
        }

        function normalizeEmail(rawEmail) {
            return String(rawEmail || "").trim().toLowerCase();
        }

        async function checkDuplicatePhoneOrEmail(phone, email, currentUid = "") {
            if (phone) {
                const qPhone = query(collection(db, "users"), where("phone", "==", phone));
                const snapPhone = await getDocs(qPhone);
                for (const d of snapPhone.docs) {
                    if (!currentUid || d.id !== currentUid) {
                        return "Yeh mobile number pehle se kisi aur account par registered hai. Multiple account allow nahi hai.";
                    }
                }
            }

            if (email) {
                const qEmail = query(collection(db, "users"), where("email", "==", email));
                const snapEmail = await getDocs(qEmail);
                for (const d of snapEmail.docs) {
                    if (!currentUid || d.id !== currentUid) {
                        return "Yeh email pehle se kisi aur account par registered hai. Multiple account allow nahi hai.";
                    }
                }
            }

            return "";
        }

        function checkDeviceLock(uid) {
            const lockedUid = localStorage.getItem(DEVICE_LOCK_KEY);
            if (lockedUid && uid && lockedUid !== uid) {
                return "Is device/browser par pehle se ek account linked hai. Multiple account allow nahi hai.";
            }
            return "";
        }

        window.toggleMode = function() {
            isSignup = !isSignup;
            hideMessage();
            document.getElementById('formTitle').innerText = isSignup ? "Create New Account" : "Login to your account";
            document.getElementById('submitBtn').innerText = isSignup ? "Register" : "Login";
            document.getElementById('identifierLabel').innerText = isSignup ? "Email Address" : "Email Address or Mobile Number";
            document.getElementById('email').placeholder = isSignup ? "Enter email address" : "Enter email or mobile number";
            
            document.getElementById('nameField').style.display = isSignup ? "block" : "none";
            document.getElementById('phoneField').style.display = isSignup ? "block" : "none";
            
            document.getElementById('fullName').required = isSignup;
            document.getElementById('phoneNumber').required = isSignup;
            document.getElementById('forgotPassBox').style.display = isSignup ? "none" : "block";
            
            document.getElementById('switchText').innerHTML = isSignup ? 
                `Already have an account? <span onclick="toggleMode()">Login</span>` : 
                `Don't have an account? <span onclick="toggleMode()">Create New Account</span>`;
        }

        window.handleAuth = async function(event) {
            event.preventDefault();
            hideMessage();

            let inputVal = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = isSignup ? "Creating Account..." : "Logging in...";

            if (isSignup) {
                const fullName = document.getElementById('fullName').value.trim();
                const phoneNumber = normalizePhone(document.getElementById('phoneNumber').value);
                const email = normalizeEmail(inputVal);

                if (!fullName) {
                    showMessage("Kripya apna Full Name bharein.", true);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Register";
                    return;
                }

                if (phoneNumber.length !== 10) {
                    showMessage("Kripya sahi 10-digit Mobile Number bharein.", true);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Register";
                    return;
                }

                let createdUser = null;
                try {
                    const existingLockedUid = localStorage.getItem(DEVICE_LOCK_KEY);
                    if (existingLockedUid) {
                        throw new Error("Is device/browser par pehle se ek account bana hua hai. Multiple account nahi bana sakte.");
                    }

                    const dupError = await checkDuplicatePhoneOrEmail(phoneNumber, email);
                    if (dupError) {
                        throw new Error(dupError);
                    }

                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    createdUser = userCredential.user;

                    const lockErr = checkDeviceLock(createdUser.uid);
                    if (lockErr) {
                        throw new Error(lockErr);
                    }

                    const dupAfterAuthErr = await checkDuplicatePhoneOrEmail(phoneNumber, email, createdUser.uid);
                    if (dupAfterAuthErr) {
                        throw new Error(dupAfterAuthErr);
                    }

                    await updateProfile(createdUser, { displayName: fullName });

                    await setDoc(doc(db, "users", createdUser.uid), {
                        name: fullName,
                        email: email,
                        phone: phoneNumber,
                        balance: 0,
                        createdAt: new Date().toISOString()
                    });

                    localStorage.setItem(DEVICE_LOCK_KEY, createdUser.uid);
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("userName", fullName);
                    localStorage.setItem("userPhone", phoneNumber);
                    
                    window.location.href = "index.html";
                } catch (error) {
                    if (createdUser) {
                        try {
                            await deleteUser(createdUser);
                        } catch (delErr) {
                            try { await signOut(auth); } catch (sErr) {}
                        }
                    }
                    const cleanMsg = (error.message || "").replace("Firebase: ", "");
                    showMessage(cleanMsg || "Account create nahi ho saka.", true);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Register";
                }
            } else {
                try {
                    let emailToUse = inputVal;

                    if (!inputVal.includes('@')) {
                        const cleanLookupPhone = normalizePhone(inputVal);
                        const q = query(collection(db, "users"), where("phone", "==", cleanLookupPhone));
                        const querySnapshot = await getDocs(q);
                        
                        if (querySnapshot.empty) {
                            throw new Error("No account found with this mobile number.");
                        }
                        
                        querySnapshot.forEach((docSnap) => {
                            emailToUse = docSnap.data().email;
                        });
                    } else {
                        emailToUse = normalizeEmail(inputVal);
                    }

                    const userCredential = await signInWithEmailAndPassword(auth, emailToUse, password);
                    const signedInUser = userCredential.user;

                    const lockErr = checkDeviceLock(signedInUser.uid);
                    if (lockErr) {
                        await signOut(auth);
                        localStorage.removeItem("isLoggedIn");
                        throw new Error(lockErr);
                    }

                    localStorage.setItem(DEVICE_LOCK_KEY, signedInUser.uid);
                    localStorage.setItem("isLoggedIn", "true");
                    if (signedInUser.displayName) {
                        localStorage.setItem("userName", signedInUser.displayName);
                    }
                    window.location.href = "index.html";
                } catch (error) {
                    let errMessage = error.message;
                    if (errMessage.includes("No account found")) {
                        errMessage = "No account found with this mobile number.";
                    } else if (errMessage.includes("Multiple account") || errMessage.includes("device/browser")) {
                        errMessage = error.message;
                    } else {
                        errMessage = "Invalid credentials. Please check your email/mobile and password.";
                    }
                    showMessage(errMessage, true);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Login";
                }
            }
        }

        window.handleForgotPassword = async function() {
            hideMessage();
            let inputVal = document.getElementById('email').value.trim();
            if (!inputVal) {
                showMessage("Please enter your registered Email Address or Mobile Number first.", true);
                return;
            }
            try {
                let emailToReset = inputVal;
                if (!inputVal.includes('@')) {
                    const cleanLookupPhone = normalizePhone(inputVal);
                    const q = query(collection(db, "users"), where("phone", "==", cleanLookupPhone));
                    const querySnapshot = await getDocs(q);
                    if (querySnapshot.empty) {
                        throw new Error("No account found with this mobile number.");
                    }
                    querySnapshot.forEach((docSnap) => {
                        emailToReset = docSnap.data().email;
                    });
                } else {
                    emailToReset = normalizeEmail(inputVal);
                }

                await sendPasswordResetEmail(auth, emailToReset);
                showMessage("Password reset link sent to your registered email! Check inbox or spam folder.", false);
            } catch (error) {
                showMessage(error.message.replace("Firebase: ", ""), true);
            }
        }
    </script>
</body>
</html>
