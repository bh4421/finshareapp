<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinShare - Private Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2, h3 { color: #1a73e8; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #1a73e8; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
        .pending { background-color: #ff9800; }
        .completed { background-color: #4caf50; }
        .btn-approve { background: #4caf50; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-approve:hover { background: #45a049; }
    </style>
</head>
<body>

<div class="container">
    <h2>FinShare Admin Dashboard</h2>

    <!-- SECTION 1: Registered Users & Payment Details -->
    <div class="card">
        <h3>1. Registered Users & Bank/UPI Details</h3>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>User Name</th>
                        <th>Mobile/Email</th>
                        <th>Bank Account</th>
                        <th>UPI ID</th>
                    </tr>
                </thead>
                <tbody id="usersTable">
                    <tr><td colspan="4">Data load ho raha hai...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- SECTION 2: Referral & Product Fulfillment Tracking -->
    <div class="card">
        <h3>2. Product Task Fulfillment (Referrals)</h3>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>User Name</th>
                        <th>Product</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="referralsTable">
                    <tr><td colspan="4">Tasks load ho rahe hain...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- APNA FIREBASE CONFIG HERE ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. Fetch Users & Bank Details
    async function loadUsers() {
        const tbody = document.getElementById('usersTable');
        tbody.innerHTML = "";
        try {
            const querySnapshot = await getDocs(collection(db, "users"));
            if (querySnapshot.empty) {
                tbody.innerHTML = "<tr><td colspan='4'>Koi user nahi mila.</td></tr>";
                return;
            }
            querySnapshot.forEach((doc) => {
                const u = doc.data();
                tbody.innerHTML += `
                    <tr>
                        <td>${u.name || 'N/A'}</td>
                        <td>${u.phone || u.email || 'N/A'}</td>
                        <td>${u.bankAccount || 'N/A'}</td>
                        <td>${u.upiId || 'N/A'}</td>
                    </tr>
                `;
            });
        } catch (e) {
            tbody.innerHTML = "<tr><td colspan='4' style='color:red;'>Error loading users!</td></tr>";
        }
    }

    // 2. Fetch Tasks & Fulfillment Status
    async function loadReferrals() {
        const tbody = document.getElementById('referralsTable');
        tbody.innerHTML = "";
        try {
            const querySnapshot = await getDocs(collection(db, "conversions"));
            if (querySnapshot.empty) {
                tbody.innerHTML = "<tr><td colspan='4'>Koi task tracking data nahi hai.</td></tr>";
                return;
            }
            querySnapshot.forEach((document) => {
                const ref = document.data();
                const isPending = ref.status === 'Pending';
                const statusBadge = isPending 
                    ? `<span class="badge pending">Pending</span>` 
                    : `<span class="badge completed">Completed</span>`;
                
                const actionBtn = isPending 
                    ? `<button class="btn-approve" onclick="approveTask('${document.id}')">Approve</button>` 
                    : `Done`;

                tbody.innerHTML += `
                    <tr>
                        <td>${ref.userName || 'N/A'}</td>
                        <td>${ref.productTitle || 'N/A'}</td>
                        <td>${statusBadge}</td>
                        <td>${actionBtn}</td>
                    </tr>
                `;
            });
        } catch (e) {
            tbody.innerHTML = "<tr><td colspan='4' style='color:red;'>Error loading tasks!</td></tr>";
        }
    }

    // 3. Approve Task Functionality
    window.approveTask = async function(docId) {
        try {
            const taskRef = doc(db, "conversions", docId);
            await updateDoc(taskRef, { status: "Completed" });
            alert("Task Approve ho gaya hai!");
            loadReferrals(); // Refresh list
        } catch (e) {
            alert("Approve karne me error aayi: " + e.message);
        }
    };

    // Load Data on Startup
    loadUsers();
    loadReferrals();
</script>

</body>
</html>
