<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinShare - Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
        }
        .menu-shell {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
            box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
            display: flex;
            flex-direction: column;
        }

        /* Top Brand Header */
        .menu-top-header {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .brand-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-logo-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 800;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .brand-title {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.2;
        }
        .brand-tagline {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }
        .btn-logout-top {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 8px 13px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Menu Items List */
        .menu-list {
            padding: 8px 0;
            flex: 1;
        }
        .menu-row {
            width: 100%;
            background: #ffffff;
            border: none;
            border-bottom: 1px solid #f1f5f9;
            padding: 15px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
            cursor: pointer;
            transition: background 0.15s;
        }
        .menu-row:hover {
            background: #eff6ff;
            color: #1d4ed8;
        }
        .menu-row-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-row-icon {
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
        }
        .menu-arrow {
            color: #94a3b8;
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="menu-shell">
        <div class="menu-top-header">
            <div class="brand-left">
                <div class="brand-logo-box">FS</div>
                <div>
                    <div class="brand-title">FinShare</div>
                    <div class="brand-tagline">Earn by offers</div>
                </div>
            </div>
            <button class="btn-logout-top" onclick="logoutUser()">Logout</button>
        </div>

        <nav class="menu-list">
            <button class="menu-row" onclick="window.location.href='index.html'">
                <span class="menu-row-left">
                    <span class="menu-row-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="9"></rect>
                            <rect x="14" y="3" width="7" height="5"></rect>
                            <rect x="14" y="12" width="7" height="9"></rect>
                            <rect x="3" y="16" width="7" height="5"></rect>
                        </svg>
                    </span>
                    <span>Dashboard</span>
                </span>
                <span class="menu-arrow">›</span>
            </button>

            <button class="menu-row" onclick="window.location.href='leads.html'">
                <span class="menu-row-left">
                    <span class="menu-row-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </span>
                    <span>My Leads</span>
                </span>
                <span class="menu-arrow">›</span>
            </button>

            <button class="menu-row" onclick="window.location.href='index.html#earnings'">
                <span class="menu-row-left">
                    <span class="menu-row-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                            <line x1="2" y1="10" x2="22" y2="10"></line>
                        </svg>
                    </span>
                    <span>Earnings</span>
                </span>
                <span class="menu-arrow">›</span>
            </button>

            <button class="menu-row" onclick="window.location.href='about.html'">
                <span class="menu-row-left">
                    <span class="menu-row-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                    </span>
                    <span>About Us</span>
                </span>
                <span class="menu-arrow">›</span>
            </button>

            <button class="menu-row" onclick="window.location.href='contact.html'">
                <span class="menu-row-left">
                    <span class="menu-row-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span>
                    <span>Contact Us</span>
                </span>
                <span class="menu-arrow">›</span>
            </button>

            <button class="menu-row" onclick="window.location.href='dmca.html'">
                <span class="menu-row-left">
                    <span class="menu-row-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                    </span>
                    <span>DMCA</span>
                </span>
                <span class="menu-arrow">›</span>
            </button>

            <button class="menu-row" onclick="window.location.href='disclaimer.html'">
                <span class="menu-row-left">
                    <span class="menu-row-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </span>
                    <span>Disclaimer</span>
                </span>
                <span class="menu-arrow">›</span>
            </button>

            <button class="menu-row" onclick="window.location.href='privacy-policy.html'">
                <span class="menu-row-left">
                    <span class="menu-row-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <span>Privacy Policy</span>
                </span>
                <span class="menu-arrow">›</span>
            </button>

            <button class="menu-row" onclick="window.location.href='terms.html'">
                <span class="menu-row-left">
                    <span class="menu-row-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                    </span>
                    <span>Terms &amp; Conditions</span>
                </span>
                <span class="menu-arrow">›</span>
            </button>
        </nav>
    </div>

    <script>
        function logoutUser() {
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("userName");
            localStorage.removeItem("userPhone");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
